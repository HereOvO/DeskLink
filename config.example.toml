[network]
# --- Windows Host (desklink-windows.exe) ---
# Address of the machine that receives input. For Windows -> Windows this is
# the client PC. With a direct cable use the static address you gave it.
target = "192.168.66.2:24801"
# Local page used to drag the remote screen into place.
ui_bind = "127.0.0.1:24802"
# Clipboard channel is reached at <target ip>:control_port.
control_port = 24800

# --- Windows Client (desklink-windows-client.exe) / Linux Client ---
# Where input is received.
bind = "0.0.0.0:24801"
# Where the clipboard channel is served.
control_bind = "0.0.0.0:24800"

[security]
# Must be identical on both machines.
token = "replace-with-a-long-random-token"

[performance]
# Merge high-frequency mouse events into a small time window.
mouse_flush_ms = 2
# Restore local control after this many milliseconds without an ACK.
disconnect_timeout_ms = 6000

[clipboard]
enabled = true
poll_ms = 400
# Default 64 MiB. Increase this on both machines when larger text is needed.
max_bytes = 67108864

[topology]
# Place the remote screen on this edge of the complete Windows virtual desktop.
enabled = true
edge = "right" # left, right, top or bottom
# Size of the remote-screen box. Set it to the CLIENT desktop resolution: the
# client prints its real desktop on startup, and a mismatch is logged there.
remote_width = 1920
remote_height = 1080
# Set these through the localhost layout page, or enter logical desktop coordinates.
# remote_x = 3840
# remote_y = 0
enter_margin_px = 1
edge_delay_ms = 80
return_cooldown_ms = 500
