# 被控端（另一台 Windows）: desklink-windows-client.exe
[network]
bind = "0.0.0.0:24801"
control_bind = "0.0.0.0:24800"

[security]
token = "replace-with-a-long-random-token"

[clipboard]
enabled = true
poll_ms = 400
max_bytes = 67108864

[topology]
enabled = true
edge = "right"
remote_width = 1920
remote_height = 1080